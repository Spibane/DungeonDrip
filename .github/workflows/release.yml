name: Release

# Publishing is driven entirely by pushing a tag:
#
#   git tag v0.11.0 && git push origin v0.11.0
#
# which builds the tagged commit and attaches the zip to a GitHub Release. Users of the
# third-party repository then see the update on their next plugin-list refresh.
#
# Nothing here writes to main. repo.json is committed as part of the release change and only
# verified below, so main can require pull requests without CI needing to bypass that. The
# version bump, the changelog heading and repo.json therefore all belong in the same pull
# request - see the Releasing section of the readme.

on:
  push:
    tags: ['v*']

# Creating the release needs this. Pushing does not happen at all.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # The tag itself, so the zip is built from exactly what was tagged. This used to check
      # out main because repo.json was committed back onto it, which meant a commit landing
      # between the tag and this run was what actually got published.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch origin main --tags --force
          $tagSha = git rev-list -n 1 $env:GITHUB_REF_NAME
          git merge-base --is-ancestor $tagSha origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $env:GITHUB_REF_NAME is not an ancestor of main; refusing to publish it as the latest release."
          }
          Write-Host "Tag $env:GITHUB_REF_NAME -> $tagSha, on main."

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Same as the build workflow: the SDK compiles against XIVLauncher's assemblies, which
      # no runner has, and the dev distribution is that same set of files.
      - name: Fetch Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath dalamud
          echo "DALAMUD_HOME=$env:GITHUB_WORKSPACE\dalamud" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build DungeonDrip.sln -c Release --nologo

      # DalamudPackager always names its output latest.zip, and the platform folder depends
      # on how MSBuild resolved the solution configuration, so search rather than guess.
      - name: Collect the plugin zip
        run: |
          $zip = Get-ChildItem -Path DungeonDrip\bin -Recurse -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw "DalamudPackager produced no zip - did the build actually run?" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $zip.FullName dist\DungeonDrip.zip
          Write-Host "Packaged $($zip.FullName) -> dist\DungeonDrip.zip"

      # Verifies rather than rewrites: the committed manifest has to be what the generator
      # would produce, and its version has to match the tag. Either mismatch would give a
      # release Dalamud never offers as an update, and both are the author's to fix in the
      # release pull request rather than something CI can paper over by pushing.
      - name: Verify repo.json
        run: python tools\make-repo-json.py --check --check-tag $env:GITHUB_REF_NAME

      # Release first: repo.json points at releases/latest/download, so the target has to
      # exist before the manifest advertising it is published.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools\release-notes.py > notes.md
          gh release create $env:GITHUB_REF_NAME dist\DungeonDrip.zip `
            --title "Dungeon Drip $env:GITHUB_REF_NAME" `
            --notes-file notes.md
