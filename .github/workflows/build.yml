name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Dalamud SDK compiles against the assemblies shipped with XIVLauncher, which no CI
      # runner has. The dev distribution is the same set of files.
      - name: Fetch Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath dalamud
          echo "DALAMUD_HOME=$env:GITHUB_WORKSPACE\dalamud" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build DungeonDrip.sln -c Release --nologo

      # Here as well as in the release workflow, and deliberately: the release run only fires on
      # a tag, by which point a forgotten manifest means deleting the tag and starting again.
      # A version bump that did not regenerate repo.json fails on the pull request instead.
      - name: Verify repo.json
        run: python tools\make-repo-json.py --check

      # DalamudPackager writes the installable zip here; the platform folder depends on how
      # MSBuild resolved the solution configuration.
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonDrip
          if-no-files-found: error
          path: |
            DungeonDrip/bin/Release/DungeonDrip/
            DungeonDrip/bin/x64/Release/DungeonDrip/
